name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  # Permite disparar o deploy manualmente pela aba Actions do GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; se chegar um push novo no meio, o anterior e cancelado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Alimenta as meta tags de preview do WhatsApp (og:image, og:url).
          VITE_SITE_URL: https://robsonizaopaidoconsorcio.com.br
          # Dominio proprio serve na raiz.
          VITE_BASE_PATH: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
